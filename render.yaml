# Render Blueprint for ReFound — free tier, Singapore (see Docs/responsibility-map.md).
# Render dashboard → New → Blueprint → pick this repo. No secret values live here:
# JWT_SECRET is generated by Render and DATABASE_URL comes from the database below.
services:
  - type: web
    name: refound-api
    runtime: node
    plan: free
    # CD: deploy each push to main, but only once GitHub CI checks pass.
    autoDeployTrigger: checksPass
    region: singapore # must match the database: internal URLs only work inside one region
    rootDir: backend
    buildCommand: npm ci
    # Free web services have no pre-deploy step, so the (idempotent) schema runs at start.
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: refound-demo-db
          property: connectionString # the internal URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

  - type: web
    name: refound-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # CD: deploy each push to main, but only once GitHub CI checks pass.
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite # React Router: every path serves the app
        source: /*
        destination: /index.html

databases:
  - name: refound-demo-db
    # DEMO data only: showcase rows for the mentor. Never the target of a local reset.
    plan: free
    region: singapore
