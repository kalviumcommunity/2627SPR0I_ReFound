# ReFound: the API and its PostgreSQL database, started together with one command:
#   cp .env.example .env    (then replace the placeholder passwords in .env)
#   docker compose up --build
# Every value comes from .env. Nothing here belongs to one laptop.
# No worker service on purpose: incident #8 has no stuck job or background step
# (see README, "No worker process").

services:
  api:
    build: ./backend
    # One named image. Local and demo both run this tag; only the config changes.
    image: refound-api:local
    environment:
      PORT: ${PORT:-3000}
      # "db" is the Compose service name below: containers reach each other by
      # service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-refound}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-refound}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # Apply the schema (safe to re-run), then start the server.
    command: sh -c "npm run db:init && node src/server.js"
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-refound}
    volumes:
      - refound-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  refound-db:
