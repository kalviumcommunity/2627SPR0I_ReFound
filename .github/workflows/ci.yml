# CI: every pull request and every push to main must pass these checks.
# CD: Render (render.yaml) deploys main only after these checks pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refound
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: refound_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refound -d refound_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # A disposable database that exists only for this run. Not a real secret.
      DATABASE_URL: postgres://refound:ci-only-throwaway-password@localhost:5432/refound_test
      # db:init and the server refuse to start without a 32+ character secret. Throwaway, CI only.
      JWT_SECRET: ci-only-throwaway-jwt-secret-at-least-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:init
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t refound-api:ci backend
